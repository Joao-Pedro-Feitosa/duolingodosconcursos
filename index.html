<script>
const BLOCKS=[
["1. IBGE e o Censo Agro (pág. 3–10)",["IBGE fundado em 1936; missão: retratar o Brasil com informações necessárias ao conhecimento da realidade e ao exercício da cidadania.","Rede: 27 Superintendências Estaduais (26 capitais + 1 no DF) e 566 Agências municipais.","Censo = levantamento de TODO o universo investigado. Aqui o universo são os estabelecimentos agropecuários.","Agropecuário: agricultura e pecuária. Florestal: cultivo/manejo/exploração de florestas e matas, nativas ou plantadas, e extrativismo. Aquícola: criação de plantas e animais com ciclo de vida total ou parcial em meio aquático.","1º Censo Agro: 1920. 1940–1970: a cada 10 anos; depois a cada 5. 1990 não ocorreu (feito em 1996). Séc. XXI: 2007 e 2017.","12º Censo: coleta em 2027, referência no ano anterior; cerca de 5,1 milhões de estabelecimentos; ~36 mil temporários.","Segue recomendações da FAO. Resultados por município; permite recortes (Terras Indígenas, Quilombolas, UCs, Biomas, Assentamentos). Ajuda a avaliar políticas como o Pronaf.","Coleta digital: DMC (Dispositivo Móvel de Coleta), mapas digitais e imagens de satélite."]],
["2. Estrutura censitária e funções (pág. 11–19)",["Permanente: Sede (diretorias) e SES. Temporária: CNQ, CEQ e Postos Censitários.","CNQ (nacional) e CEQ (estadual) monitoram a qualidade dos dados. Analistas Censitários + Agentes Censitários de Qualidade (ACQ).","Posto censitário: AOR, ACA (administrativo), ACI (informática), ACR, ACS e Recenseador.","Hierarquia de campo: AOR → ACR → ACS → Recenseador.","ACS: supervisiona e treina Recenseadores, é o elo entre quem coleta e quem gerencia. É a ele que o Recenseador reporta dúvidas e dificuldades.","ACR: monitora cobertura e cronograma, responde alertas, apoia ACS.","Recenseador: coleta presencial em rotas diárias, entrevista, preenche questionários, registra coordenadas e fotos, zela pelo DMC e pelo sigilo.","Posto censitário: local temporário de apoio. Recenseador comparece quando requisitado e retorna a campo se o dado precisar de correção."]],
["3. Instrumentos de trabalho (pág. 20–22)",["Setor censitário: menor área geográfica definida pelo IBGE; unidade territorial de coleta; prioritariamente rural.","Mapa do Setor (limites descritos no verso), Descritivo do Setor, Mapa Municipal Estatístico (MME, fixado no posto: visão geral de todos os setores e vias de acesso).","DMC = tablet: mapa digital do setor (imagem de satélite com limites destacados), Lista de Endereços (lista prévia) e Questionários.","Lista prévia: atualizar confirmando, incluindo novos e excluindo os não encontrados. Visitar TODOS os endereços do setor, mesmo os fora da lista.","Questionário: identificação/localização do estabelecimento, produtor ou administrador, produção, área, uso das terras.","Manual do Recenseador: usado no treinamento e como consulta."]],
["4. Navegação e mapa (pág. 23–31)",["Elementos do mapa: legenda (nunca interprete símbolo sem consultá-la), escala, imagem de satélite, descritivo.","Escala 1:50.000 → 1 cm = 500 m. Ex.: 3 cm = 1.500 m = 1,5 km (~20 min a pé).","Imagem de satélite: observe forma, tamanho, localização, cores (pastagem em tons de verde).","Descritivo tem 5 partes: (1) ponto inicial/final, (2) descrição do perímetro, (3) setores a excluir, (4) estruturas territoriais não setorizadas, (5) acessibilidade e observações.","Ponto inicial inviável: pode usar outro de mais fácil acesso, MAS comunicar sempre o Supervisor.","Limites: corpos hídricos, rodovias/estradas/ferrovias, caminhos/ramais, linhas secas (não materializadas).","O Recenseador NUNCA altera o perímetro do setor. Dificuldade para identificar limite: comunicar imediatamente à supervisão.","Setores a excluir (ex.: setor urbano dentro do rural): não coletar, outro Recenseador faz.","Não setorizadas (aglomerados rurais, localidades indígenas pequenas): recensear normalmente, com atenção ao acesso e abordagem.","Não confiar só no GPS nem deixar de usar o mapa em papel."]],
["5. Divisão territorial e setores (pág. 32–38)",["UFs: 26 estados + DF. Municípios: 5.569. Distritos: 10.744. Subdistritos: ~645 (só em grandes cidades). Distrito Estadual: Fernando de Noronha.","Distritos não têm autonomia: subordinam-se ao governo municipal.","Geocódigo do setor: UF (2) + município (5) + distrito (2) + subdistrito (2) + setor (4). Ex.: 51 04104 05 00 0016. Aparece no título/rodapé do mapa e no canto superior direito do descritivo.","Setor tem dois códigos: situação (urbano/rural) e tipo (restrições/procedimentos especiais).","Rural: aglomerado rural (domicílios até ~50 m entre si, a mais de 1 km de cidades/vilas) e rural exclusive aglomerados (dispersão). Urbano: alta densidade, baixa densidade e núcleo urbano. Massa d’água: não é área de coleta.","Tipos: não especial; quartel/base militar (≥50 hab.); alojamento/acampamento (≥50 hab. há mais de 1 ano); baixo patamar domiciliar; agrupamento indígena e quilombola (15 ou mais pessoas); unidade prisional (>50 presos); convento/hospital/ILPI/IACA (>50 hab.); agrovila (>50 domicílios de Projeto de Assentamento).","Setores de tipo especial só são visitados se tiverem produção agropecuária, florestal ou aquícola.","Não registrar endereços nem fazer entrevistas fora do setor designado."]],
["6. PCTs (pág. 39–42)",["Povos e Comunidades Tradicionais: indígenas, quilombolas, ciganos, pescadores artesanais, extrativistas, caiçaras, caatingueiros, vazanteiros, pantaneiros, retireiros, morroquianos, fundos e fechos de pasto.","Pertencimento é AUTODECLARATÓRIO: registrar o que o informante declarar, sem questionar, julgar ou corrigir. Uma pessoa pode ter mais de uma identidade.","3 categorias: territórios oficialmente reconhecidos (TI, quilombolas, UCs, parte dos assentamentos); agrupamentos identificados pelo IBGE (indígenas, quilombolas); áreas para fins da operação (AIO).","AIO: recorte independente dos setores, pode ser menor ou maior que um setor (até um município). Carrega automaticamente no mapa digital e ativa perguntas específicas no DMC.","Acesso negociado previamente com lideranças e órgãos parceiros. Base: Convenção 169 da OIT (consulta prévia).","Em terras indígenas pode haver guia institucional/guia-intérprete, indicado com apoio da FUNAI e da SESAI."]],
["7. Endereço e coordenadas (pág. 43–50)",["Padrão CNEFE. Prioridade: endereço formal; na ausência, referências locais que individualizem e permitam localizar.","Componentes: logradouro, localidade, CEP, número e modificador, complemento, ponto de referência, coordenadas.","Logradouro: nome oficial (prefeitura), sem omitir termos e sem abreviações; se não houver, o nome local. Pode ser estrada, rodovia, acesso ou até um rio.","Localidade: povoado, lugarejo, assentamento, comunidade (rural); semelhante a bairro (urbano). Evitar termos genéricos; perguntar à população local.","CEP: 8 dígitos, mantido pelos Correios (ECT).","Número e modificador podem não existir. Complemento: lote, gleba, casa, fundos, sala, andar.","Ponto de referência: ponto fixo e estável; OBRIGATÓRIO quando não há número ou complemento que permita localizar. Não usar de forma redundante.","É PROIBIDO identificar pessoas nos componentes do endereço (fere o sigilo estatístico).","Latitude: 0° a 90°, N/S (sul é negativo). Longitude: 0° a 180°, L/O (oeste é negativo), a partir de Greenwich.","Em área rural a captura de coordenadas é MANUAL, feita na entrada da edificação-sede (ponto de acesso à unidade)."]],
["8. Estabelecimento agropecuário (pág. 51–58)",["Data de referência: 31/12/2025 (momento específico). Período de referência: 01/01/2025 a 31/12/2025 (intervalo).","Recenseável: unidade com produção/exploração, total ou parcial, agropecuária, florestal ou aquícola, para venda ou subsistência.","Não recenseável: lazer/passatempo, criação só de pássaros, cães e gatos, animais de laboratório/soros/vacinas. Também: hortos, postos zootécnicos e estações experimentais, hotéis-fazenda e lazer, conventos e igrejas, hospitais/asilos/orfanatos, escolas profissionalizantes e patronatos, prisões e reformatórios.","Quem classifica é o questionário de abordagem inicial, não o Recenseador. Sempre PERGUNTAR ao morador; não dá para saber olhando a cerca.","Subsistência: alimentos para necessidades vitais da família; parte pode ser vendida/trocada.","Estabelecimento: independe de tamanho, forma jurídica, localização (rural ou urbana) e valor da produção.","Lavoura temporária (milho, feijão, arroz, soja) vs permanente (café, laranja, uva). Horticultura, hidroponia, criação de animais, aquicultura, exploração florestal.","Pesque-pague: só é estabelecimento se houver criação/engorda de peixes (só compra = não).","Produtor sem área: mel em colmeias na mata, extrativista, criador em beira de estrada, produtor que já saiu da terra na data de referência. Aplicar o questionário, marcando o item de produtor sem área."]],
["9. Situações especiais (pág. 59–66)",["Indústria com atividade agro: investigar só a parte agropecuária; dados industriais vêm de outras pesquisas.","Boitel: só é estabelecimento se tiver animais próprios ou outra atividade agro; animais de terceiros contam no estabelecimento do dono.","Propriedade rural ≠ estabelecimento. Uma propriedade pode ter vários estabelecimentos; várias propriedades podem formar um só.","Sede: local de administração, dentro da área; muitas vezes é a residência. Estabelecimento em mais de um setor: recenseado onde está a Sede. Sem Sede: onde está a maior parte das terras.","Áreas não contínuas = 1 estabelecimento se atenderem SIMULTANEAMENTE às 4 condições: mesmo município, mesmos recursos técnicos, mesmos recursos humanos, única administração. Rios, estradas e ferrovias cortando a terra NÃO caracterizam descontinuidade.","Áreas em municípios diferentes: estabelecimentos distintos; contatar o supervisor.","Sucessão/partilha: com consenso entre herdeiros = 1 estabelecimento (informa o inventariante ou representante). Cada herdeiro em uma parte = estabelecimentos diferentes. Litígio: produtor é quem era responsável economicamente na data de referência.","Novos ou sem produção: SÃO recenseados (pés novos, perda por clima). Registrar o motivo no campo Observações do DMC.","Exploração comunitária: produção coletiva = 1 questionário; individual = 1 questionário por família."]]
];

0:`<div class="vis">${R(c("1920","1º Censo Agro"),A,c("1936","Fundação do IBGE","a"),A,c("1940–70","a cada 10 anos"),A,c("1975–85","a cada 5 anos"),A,c("1996","(1990 não houve)"),A,c("2007","Censo"),A,c("2017","Censo"),A,c("2027","12º Censo","a"))}<p class="cap">Linha do tempo dos Censos Agropecuários</p></div><div class="vis">${R(c("🌾","Agropecuário<br>lavoura e pecuária"),c("🌲","Florestal<br>matas, silvicultura, extrativismo"),c("🐟","Aquícola<br>ciclo de vida em meio aquático"))}</div>`,
1:`<div class="vis">${R(c("AOR","gere o posto","a"))}${R(D)}${R(c("ACR","cobertura, prazos e alertas"),c("ACA / ACI","apoio administrativo e TI"))}${R(D)}${R(c("ACS","supervisiona e treina"))}${R(D)}${R(c("Recenseador","coleta presencial","a"))}<p class="cap">Hierarquia no Posto Censitário. Dúvida em campo? Fale com o ACS.</p></div><div class="vis">${R(c("Presidência",""),A,c("Sede","CNQ (nacional)"),c("SES","CEQ (estadual) + Postos"))}<p class="cap">Qualidade: CNQ e CEQ. Estrutura temporária ligada à estrutura permanente.</p></div>`,
2:`<div class="vis">${R(c("🗺️","Mapa do Setor<br>limites no verso"),c("📝","Descritivo<br>perímetro em texto"),c("🏛️","MME<br>fixado no posto"),c("📱","DMC<br>mapa digital, lista, questionário","a"),c("📖","Manual do<br>Recenseador"))}<p class="cap">Os 5 instrumentos de trabalho</p></div><div class="vis">${R(c("✅","Confirmar<br>endereços que existem","g1"),c("➕","Incluir<br>novos encontrados","g1"),c("➖","Excluir<br>os não encontrados","r1"))}<p class="cap">Como atualizar a lista prévia de endereços</p></div>`,

4:`<div class="vis">${R(c("51","UF","a"),c("04104","Município","a"),c("05","Distrito","a"),c("00","Subdistrito","a"),c("0016","Setor","a"))}<p class="cap">Geocódigo: 2 + 5 + 2 + 2 + 4 dígitos</p></div><div class="vis">${R(c("26 + DF","Estados"),A,c("5.569","Municípios"),A,c("10.744","Distritos"),A,c("~645","Subdistritos"),A,c("Setores","menor unidade","a"))}</div>`,

6:`<div class="vis"><p style="text-align:center;font-size:.95rem"><b style="color:var(--ac2)">Fazenda Alegria</b> · <b>25</b> · <i>em frente ao Açude do Cedro</i> – <b style="color:var(--ko)">Povoado de Areia Branca</b>, <b>65056-000</b></p>${R(c("Logradouro","nome oficial"),c("Número","posição"),c("Ponto de ref.","fixo e estável"),c("Localidade","povoado, bairro"),c("CEP","8 dígitos"))}</div><div class="vis">${R(c("↔ Latitude","Equador 0° a 90°<br>Norte + / Sul −"),c("↕ Longitude","Greenwich 0° a 180°<br>Leste + / Oeste −"))}<p class="cap">Brasil: latitude e longitude costumam ser negativas</p></div>`,
